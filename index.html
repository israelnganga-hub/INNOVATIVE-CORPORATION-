<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INNO CORP. — Innovation Corporation</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@200;300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --navy: #0b1220; --navy2: #0f1a2e; --navy3: #152038;
            --panel: #111d30; --border: #1e2f48; --border2: #2a4060;
            --gold: #c9a84c; --gold2: #e8c96a; --gold3: #a07830;
            --gold-glow: rgba(201,168,76,0.45); --text: #8aa0b8; --muted: #3d5570;
            --teal: #2a8fa0; --rose: #a05878;
        }
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body {
            background: var(--navy); color: var(--text);
            font-family: 'Raleway', sans-serif; font-weight: 300;
            overflow-x: hidden; cursor: none;
        }

        /* Shiny Cursor */
        .cursor { position:fixed; width:9px; height:9px; background:var(--gold2); border-radius:50%; pointer-events:none; z-index:99999; mix-blend-mode:screen; box-shadow:0 0 15px var(--gold-glow); }
        .cursor-ring { position:fixed; width:36px; height:36px; border:1.5px solid var(--gold); border-radius:50%; pointer-events:none; z-index:99998; transform:translate(-18px,-18px); transition:all .25s; }

        /* Background */
        body::after {
            content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
            background-image: linear-gradient(rgba(201,168,76,0.035) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(201,168,76,0.035) 1px, transparent 1px);
            background-size: 60px 60px; animation: grid-shift 30s linear infinite;
        }
        @keyframes grid-shift { to { background-position: 60px 60px; } }

        /* NAV - Clean & Original Feel */
        nav {
            position:fixed; top:0; left:0; right:0; z-index:1000;
            padding: 0 64px; height:76px; display:flex; align-items:center;
            justify-content:space-between; background: rgba(11,18,32,0.96);
            backdrop-filter: blur(24px); border-bottom: 1px solid var(--border);
        }
        .nav-logo { display:flex; align-items:center; gap:14px; text-decoration:none; }
        .logo-nut { font-size:38px; color:var(--gold2); filter:drop-shadow(0 0 12px var(--gold-glow)); transition:0.4s; }
        .nav-logo:hover .logo-nut { transform:rotate(25deg) scale(1.08); }
        .nav-logo-text { font-family:'Cinzel', serif; font-size:18px; font-weight:700; color:var(--white); letter-spacing:4px; }
        .nav-logo-text span { color:var(--gold2); }

        .nav-links { display:flex; gap:36px; list-style:none; }
        .nav-links a {
            font-family:'Share Tech Mono', monospace; font-size:10px; color:var(--muted);
            text-decoration:none; letter-spacing:2px; text-transform:uppercase;
            position:relative;
        }
        .nav-links a::after {
            content:''; position:absolute; bottom:-5px; left:0; right:100%; height:1px;
            background:var(--gold2); transition:right .4s ease;
        }
        .nav-links a:hover { color:var(--gold2); }
        .nav-links a:hover::after { right:0; }

        .nav-cta {
            font-family:'Share Tech Mono', monospace; font-size:10px; letter-spacing:2px;
            color:var(--navy); background:linear-gradient(135deg, var(--gold2), var(--gold3));
            padding:10px 26px; text-decoration:none; text-transform:uppercase;
            box-shadow:0 4px 20px var(--gold-glow); transition:all .3s;
        }
        .nav-cta:hover { transform:translateY(-2px); box-shadow:0 8px 25px var(--gold-glow); }

        /* Hero */
        .hero {
            min-height:100vh; display:flex; flex-direction:column; justify-content:center;
            position:relative; padding:140px 64px 100px;
            background: linear-gradient(rgba(11,18,32,0.75), rgba(11,18,32,0.88)),
                        url('https://picsum.photos/id/1015/2000/1300') center/cover no-repeat fixed;
        }

        /* Shine effects */
        .btn-gold:hover, .domain-card:hover {
            box-shadow: 0 12px 35px var(--gold-glow);
        }

        .reveal { opacity:0; transform:translateY(40px); transition:all .8s ease; }
        .reveal.visible { opacity:1; transform:translateY(0); }
    </style>
</head>
<body>
    <div class="cursor" id="cursor"></div>
    <div class="cursor-ring" id="cursorRing"></div>

    <!-- NAV -->
    <nav>
        <a href="#" class="nav-logo">
            <i class="fas fa-nut logo-nut"></i>
            <span class="nav-logo-text">INNO<span> CORP.</span></span>
        </a>
        <ul class="nav-links">
            <li><a href="#domains">Domains</a></li>
            <li><a href="#mission">Mission</a></li>
            <li><a href="#capabilities">Capabilities</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#roadmap">Roadmap</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
        <a href="#contact" class="nav-cta">Collaborate</a>
    </nav>

    <!-- HERO -->
    <section class="hero" id="hero">
        <div style="max-width:920px; position:relative; z-index:2;">
            <div class="hero-eyebrow">
                <span class="eyebrow-text">Innovation Corporation</span>
                <span class="eyebrow-dot">NAIROBI, KENYA</span>
            </div>
            <h1 style="font-family:'Cinzel', serif; font-size:clamp(52px, 8vw, 94px); line-height:1.05; color:#fff; letter-spacing:2px;">
                BUILDING A<br><span style="color:var(--gold2);">BETTER</span><br>WORLD
            </h1>
            <p style="font-size:1.4rem; color:#b8d0e8; margin:30px 0 50px;">Defence · Environment · Humanity</p>
            <div>
                <a href="#domains" class="btn-gold" style="padding:16px 42px; font-family:'Cinzel',serif; font-size:13px; letter-spacing:3px; text-decoration:none; display:inline-block; margin-right:16px;">Explore Our Work</a>
                <a href="#contact" class="nav-cta">Partner With Us</a>
            </div>
        </div>
    </section>

    <!-- Paste the rest of your original sections here (Domains with updated descriptions, Mission, Capabilities, Projects, Roadmap, Contact, Footer) -->

    <script>
        // Cursor
        const cur = document.getElementById('cursor');
        const ring = document.getElementById('cursorRing');
        let mx = 0, my = 0;
        document.addEventListener('mousemove', e => {
            mx = e.clientX; my = e.clientY;
            cur.style.left = mx - 4.5 + 'px';
            cur.style.top = my - 4.5 + 'px';
        });
        (function ringAnim() {
            ring.style.left = mx - 18 + 'px';
            ring.style.top = my - 18 + 'px';
            requestAnimationFrame(ringAnim);
        })();

        // Smooth scrolling
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    e.preventDefault();
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });

        console.log('%c✅ INNO CORP — Final Version Ready | Built with Grok', 'color:#e8c96a; font-size:14px; font-family:monospace;');
    </script>
</body>
</html>
