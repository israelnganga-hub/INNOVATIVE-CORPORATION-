<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INNO CORP. — Innovation Corporation</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@200;300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#0b1220;
      --navy2:#0f1a2e;
      --navy3:#152038;
      --panel:#111d30;
      --panel2:#14233b;
      --border:#1e2f48;
      --border2:#2a4060;
      --gold:#c9a84c;
      --gold2:#e8c96a;
      --gold3:#a07830;
      --gold-dim:rgba(201,168,76,.12);
      --gold-glow:rgba(201,168,76,.28);
      --steel:#7a9bb8;
      --steel2:#4a6b8a;
      --steel3:#b8d0e8;
      --silver:#9ab0c4;
      --white:#eef3f8;
      --text:#8aa0b8;
      --muted:#3d5570;
      --green:#4a9e6e;
      --teal:#2a8fa0;
      --rose:#a05878;
      --shadow:0 22px 70px rgba(0,0,0,.38);
      --radius:24px;
      --max:1320px;
    }

    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      background:var(--navy);
      color:var(--text);
      font-family:'Raleway',sans-serif;
      font-weight:300;
      overflow-x:hidden;
      cursor:none;
    }
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}
    button,input,textarea,select{font:inherit}

    body::before{
      content:'';
      position:fixed;inset:0;
      background:
        radial-gradient(circle at 12% 10%, rgba(201,168,76,.08), transparent 28%),
        radial-gradient(circle at 88% 20%, rgba(42,143,160,.08), transparent 24%),
        radial-gradient(circle at 82% 84%, rgba(160,88,120,.08), transparent 24%);
      pointer-events:none;
      z-index:0;
    }
    body::after{
      content:'';
      position:fixed;inset:0;
      background-image:
        linear-gradient(rgba(201,168,76,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,.025) 1px, transparent 1px);
      background-size:60px 60px;
      pointer-events:none;
      z-index:0;
      animation:gridShift 28s linear infinite;
    }
    @keyframes gridShift{
      to{background-position:60px 60px}
    }

    .cursor{
      position:fixed;
      width:8px;height:8px;border-radius:50%;
      background:var(--gold);
      pointer-events:none;
      z-index:99999;
      mix-blend-mode:screen;
    }
    .cursor-ring{
      position:fixed;
      width:36px;height:36px;border-radius:50%;
      border:1px solid rgba(201,168,76,.5);
      pointer-events:none;
      z-index:99998;
      transform:translate(-14px,-14px);
      transition:width .2s,height .2s,border-color .2s;
    }

    .container{
      width:min(var(--max), calc(100% - 48px));
      margin:0 auto;
      position:relative;
      z-index:2;
    }

    /* NAV */
    .nav-wrap{
      position:fixed;top:0;left:0;right:0;z-index:1000;
      background:rgba(11,18,32,.88);
      backdrop-filter:blur(20px);
      border-bottom:1px solid var(--border);
    }
    nav{
      width:min(var(--max), calc(100% - 48px));
      margin:0 auto;
      height:84px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      position:relative;
    }
    nav::after{
      content:'';
      position:absolute;
      left:12%;right:12%;bottom:0;height:1px;
      background:linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity:.4;
    }
    .nav-logo{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:max-content;
    }

    .brand-mark{
      width:46px;height:46px;
      flex-shrink:0;
      filter:drop-shadow(0 0 10px rgba(201,168,76,.18));
    }

    .nav-logo-text{
      font-family:'Cinzel',serif;
      font-size:18px;
      font-weight:700;
      letter-spacing:4px;
      color:var(--white);
    }
    .nav-logo-text span{color:var(--gold)}

    .nav-links{
      display:flex;
      gap:30px;
      list-style:none;
      align-items:center;
    }
    .nav-links a{
      font-family:'Share Tech Mono',monospace;
      font-size:10px;
      letter-spacing:2px;
      text-transform:uppercase;
      color:var(--muted);
      position:relative;
      transition:.25s;
    }
    .nav-links a::after{
      content:'';
      position:absolute;
      left:0;right:100%;bottom:-4px;height:1px;
      background:var(--gold);
      transition:right .3s ease;
    }
    .nav-links a:hover,
    .nav-links a.active{color:var(--gold)}
    .nav-links a:hover::after,
    .nav-links a.active::after{right:0}

    .nav-right{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .ghost-btn,.nav-cta,.menu-btn{
      font-family:'Share Tech Mono',monospace;
      font-size:10px;
      letter-spacing:2px;
      text-transform:uppercase;
      padding:11px 18px;
      border:1px solid var(--border2);
      background:transparent;
      color:var(--steel3);
      transition:.25s;
      cursor:pointer;
    }
    .ghost-btn:hover,.menu-btn:hover{
      border-color:var(--gold3);
      color:var(--gold);
      transform:translateY(-2px);
    }
    .nav-cta{
      background:linear-gradient(135deg,var(--gold2),var(--gold3));
      border-color:var(--gold3);
      color:var(--navy);
      font-weight:700;
    }
    .nav-cta:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 30px rgba(201,168,76,.18);
    }
    .menu-btn{display:none}

    /* HERO */
    .hero{
      min-height:100vh;
      position:relative;
      padding:130px 0 76px;
      display:flex;
      align-items:center;
      overflow:hidden;
      isolation:isolate;
    }
    .hero-bg{
      position:absolute;inset:0;z-index:0;
      background:
        linear-gradient(90deg, rgba(11,18,32,.88) 0%, rgba(11,18,32,.76) 38%, rgba(11,18,32,.58) 58%, rgba(11,18,32,.84) 100%),
        radial-gradient(circle at 75% 25%, rgba(201,168,76,.12), transparent 22%),
        radial-gradient(circle at 85% 72%, rgba(42,143,160,.10), transparent 20%),
        url('https://sspark.genspark.ai/cfimages?u1=d45Cje7Qwdb3CW%2FEx71MNbQ6H3L0hR3qWl4PYYFqByc4q3cAZIhakStvRzfgpc2Ip1vp36KVsL5%2BUWTyqCPtfSwdFYX0WB3H2CJ%2Fi9J3W63BE%2BHrJ3Y%3D&u2=Ub7OLZG3EXxutpKf&width=2560') center/cover no-repeat;
      transform:scale(1.03);
    }
    .hero-bg::after{
      content:'';
      position:absolute;inset:0;
      background:
        linear-gradient(180deg, rgba(11,18,32,.14), rgba(11,18,32,.45)),
        repeating-linear-gradient(120deg, rgba(201,168,76,.028) 0 2px, transparent 2px 26px);
      mix-blend-mode:screen;
    }
    .hero-grid{
      display:grid;
      grid-template-columns:1.08fr .92fr;
      gap:42px;
      align-items:center;
    }

    .hero-eyebrow{
      display:flex;
      align-items:center;
      gap:16px;
      margin-bottom:30px;
      animation:fadeUp .8s ease both;
    }
    .eyebrow-line{width:42px;height:1px;background:var(--gold)}
    .eyebrow-text,.eyebrow-dot{
      font-family:'Share Tech Mono',monospace;
      font-size:11px;
      letter-spacing:3px;
      text-transform:uppercase;
    }
    .eyebrow-text{color:var(--gold)}
    .eyebrow-dot{
      color:var(--steel3);
      border:1px solid rgba(255,255,255,.09);
      padding:4px 10px;
      background:rgba(255,255,255,.03);
    }

    .hero-title{
      font-family:'Cinzel',serif;
      font-size:clamp(48px, 7vw, 96px);
      line-height:.97;
      letter-spacing:2px;
      color:var(--white);
      margin-bottom:16px;
      animation:fadeUp .8s .08s ease both;
    }
    .hero-title .gold{color:var(--gold)}
    .hero-title .stroke{
      color:transparent;
      -webkit-text-stroke:1px var(--steel2);
    }

    .hero-tagline{
      font-size:clamp(13px,1.6vw,18px);
      letter-spacing:6px;
      text-transform:uppercase;
      color:var(--steel);
      margin-bottom:26px;
      animation:fadeUp .8s .14s ease both;
    }

    .hero-desc{
      max-width:680px;
      font-size:16px;
      line-height:1.95;
      color:var(--steel3);
      margin-bottom:34px;
      animation:fadeUp .8s .2s ease both;
    }

    .hero-actions{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      margin-bottom:24px;
      animation:fadeUp .8s .28s ease both;
    }

    .btn-primary,.btn-secondary,.btn-mini{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      transition:.25s;
      cursor:pointer;
    }

    .btn-primary{
      border:none;
      padding:16px 30px;
      background:linear-gradient(135deg,var(--gold2),var(--gold3));
      color:var(--navy);
      font-family:'Cinzel',serif;
      font-size:12px;
      font-weight:700;
      letter-spacing:3px;
      clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
      box-shadow:0 10px 30px rgba(201,168,76,.22);
    }
    .btn-primary:hover{transform:translateY(-2px);opacity:.93}

    .btn-secondary{
      padding:15px 22px;
      border:1px solid var(--border2);
      background:rgba(255,255,255,.03);
      color:var(--steel3);
      font-family:'Share Tech Mono',monospace;
      font-size:11px;
      letter-spacing:2px;
      text-transform:uppercase;
    }
    .btn-secondary:hover{
      color:var(--gold);
      border-color:var(--gold3);
      transform:translateY(-2px);
    }

    .hero-chips{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      animation:fadeUp .8s .36s ease both;
    }
    .hero-chip{
      display:flex;
      align-items:center;
      gap:8px;
      padding:10px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.08);
      font-size:11px;
      color:var(--steel3);
      letter-spacing:.5px;
    }
    .hero-chip i{
      width:8px;height:8px;border-radius:50%;
      display:inline-block;
    }
    .hero-chip:nth-child(1) i{background:var(--gold)}
    .hero-chip:nth-child(2) i{background:var(--teal)}
    .hero-chip:nth-child(3) i{background:var(--rose)}

    .hero-panel{
      position:relative;
      min-height:620px;
      animation:fadeUp .9s .18s ease both;
    }
    .hero-stack{
      position:absolute;inset:0;
      display:grid;
      grid-template-columns:1fr 1fr;
      grid-template-rows:1.05fr .95fr;
      gap:16px;
    }

    .glass-card{
      position:relative;
      overflow:hidden;
      border-radius:24px;
      border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(180deg, rgba(17,29,48,.92), rgba(17,29,48,.72));
      box-shadow:var(--shadow);
    }
    .glass-card.large{grid-column:1 / span 2; min-height:270px}
    .glass-card img{
      width:100%;height
